[project]
name = "podcaster"
version = "0.1.0"
description = "podcaster using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pyyaml>=6.0",
]

[project.scripts]
podcaster = "podcaster.main:run"
run_crew = "podcaster.main:run"
run_graph = "podcaster_graph.main:run"
train = "podcaster.main:train"
replay = "podcaster.main:replay"
test = "podcaster.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcaster", "src/podcaster_graph"]

[tool.crewai]
type = "crew"
