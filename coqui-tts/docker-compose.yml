# Coqui image ENTRYPOINT is `tts` (CLI). Do not use `tts-server` as command — it is passed to `tts` and fails.
# Server: https://docs.coqui.ai/en/latest/docker_images.html
services:
  coqui-tts:
    image: ghcr.io/coqui-ai/tts:latest
    container_name: coqui-tts
    restart: always
    ports:
      - "5002:5002"
    entrypoint: ["python3", "TTS/server/server.py"]
    command:
      - "--model_name"
      - "tts_models/en/vctk/vits"
      - "--use_cuda"
      - "false"
    volumes:
      - ./coqui_models:/root/.local/share/tts
    environment:
      COQUI_TTS_CACHE_PATH: /root/.local/share/tts
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
