research_task:
  description: >
    Conduct a thorough research about {topic}
    Make sure you find any interesting and relevant information given
    the current date is {current_month} {current_year}.
  expected_output: >
    A list with 10 most relevant news & progress on {topic} with summary, details, excerpts, and more
  agent: researcher

reporting_task:
  description: >
    Review the context you got and organize each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: reporting_analyst

scripting_task:
  description: >
    Review the report and plan, and write an elaborate podcast script between two hosts
    who are knowledgable about the topic and yet are fun on podcast
  expected_output: >
    A full script with speaker labels, sound effects, laughs, silences, and every last bit of details.
    "{male_host}" and "{female_host}" are the speakers, give them dialogues by name.
    Do not write separate script files yourself; the task output is saved under outputs/ automatically.
  agent: scriptwriter

audio_task:
  description: >
    You receive the completed podcast script from the previous task (same content as saved under outputs/).
    Your only job is to call the gemini_voice_tool once with the entire script as the `script` argument
    (all dialogue lines, verbatim). Do not summarize or shorten. Report the WAV file path the tool returns.
    (TTS backend is chosen via TTS_PROVIDER in .env: gemini or coqui.)
  expected_output: >
    The absolute or relative path to the generated .wav file from gemini_voice_tool, and confirmation audio was created.
  agent: audio_producer
